<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t2 d2">
  <title id="t2">sortwise terminal session</title>
  <desc id="d2">A terminal window running sortwise on a Downloads folder, moving files into Documents, Images, and Applications, then writing an undo script.</desc>
  <rect width="1200" height="750" fill="#F7F8F6"/>
  <rect x="100" y="90" width="1000" height="570" rx="16" fill="#172321"/>
  <circle cx="140" cy="125" r="8" fill="#DCE5E1"/><circle cx="166" cy="125" r="8" fill="#DCE5E1"/><circle cx="192" cy="125" r="8" fill="#DCE5E1"/>
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="26" fill="#F7F8F6">
    <text x="140" y="200"><tspan fill="#9ED9CC">$</tspan> sortwise ~/Downloads --strategy type --dry-run</text>
    <text x="140" y="260" fill="#DCE5E1">SortWise: organizing 47 files in ~/Downloads (dry run)</text>
    <text x="140" y="320"><tspan fill="#9ED9CC">+</tspan> report_q3.pdf      -&gt; Documents/report_q3.pdf</text>
    <text x="140" y="365"><tspan fill="#9ED9CC">+</tspan> photo_001.jpg      -&gt; Images/photo_001.jpg</text>
    <text x="140" y="410"><tspan fill="#9ED9CC">+</tspan> photo_001 (1).jpg  -&gt; Images/photo_001_2.jpg</text>
    <text x="140" y="455"><tspan fill="#9ED9CC">+</tspan> setup.dmg          -&gt; Applications/setup.dmg</text>
    <text x="140" y="520" fill="#DCE5E1">47 files, 6 categories. Nothing moved (dry run).</text>
    <text x="140" y="565" fill="#DCE5E1">Undo script would be written to ~/Downloads/.sortwise_undo.sh</text>
    <text x="140" y="625"><tspan fill="#9ED9CC">$</tspan> <tspan fill="#9ED9CC">_</tspan></text>
  </g>
</svg>
