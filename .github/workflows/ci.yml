name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:links
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - run: npm run check:external
        continue-on-error: true
      - name: Secret scan
        run: |
          if git grep -nE 'gh[pousr]_[A-Za-z0-9]{20,}|sk-ant-[A-Za-z0-9-]{20,}|AKIA[0-9A-Z]{16}' -- . ':!package-lock.json'; then
            echo "possible secret committed"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: out
          retention-days: 7
